# Classical segmenters x preprocessing grid (lists expand to a cartesian product)
segmenters:
  - name: daugman
    params: {channel: [gray, red, v], clahe: [false, true], inpaint: [false, true]}
  - name: hough
    params: {channel: [gray, red, v], clahe: [false, true], inpaint: [false, true]}
  - name: raycast
    params: {channel: [gray, red, v], clahe: [false, true], inpaint: [false, true]}
  # wider radius search for close-up (iris fills the frame) capture; tuned on UPOL *val* visually
  - name: daugman
    params: {channel: red, clahe: true, inpaint: true, rmax_frac: 0.6}
  - name: raycast
    params: {channel: red, clahe: true, inpaint: true, rmax_frac: 0.6}
  - name: hough
    params: {channel: red, clahe: true, inpaint: true, rmax_frac: 0.6}
