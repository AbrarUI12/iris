# Default pipeline = benchmark winner (see results/BENCHMARK.md)
segmentation:
  name: auto                       # Daugman for iris-filling close-ups, learned small_160 otherwise
  params: {model: seg_small_160.onnx, closeup_frac: 0.40, rmax_frac: 0.6}
quality: {model_path: models/quality_model.json}   # learned gate (bench/quality.py); re-fit on A-EYE photos
normalization: {n_r: 64, n_t: 512, mirror_left: false}
color: {model_path: models/color_model.json, uncertain_margin: 0.15}
markings:
  dark_pigmentation: {method: deltaE, k: 3.5}
  white_marking: {method: deltaL, k: 2.5}
  lacuna: {method: dog, k: 2.0}
  contraction_furrow: {method: ridge, k: 4.0}
  collarette: {method: gradient}
  fibre_type: {method: structure_tensor, threshold: 0.2}
